[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../../lib"]
solc = "0.8.26"

optimizer = true
optimizer_runs = 200

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[profile.ci]
verbosity = 3
fuzz = { runs = 256 }

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api" }
